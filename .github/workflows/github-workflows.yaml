# im testing github workflows

name: Automatically commit releases

run-name: ${{ github.repository }}

on:
  push:
    branches:
      - test-level-loader

permissions:
  contents: write

jobs:
  explore-github-actions:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          
      - name: Compile code for Java 8
        shell: cmd
        run: |
          dir
          echo Generating class
          cd tmp
          if not exist "classes\" mkdir classes
          cd ..
          javac -encoding UTF-8 -classpath "lib\*" -sourcepath src -d tmp\classes @sourcelist.txt
          if errorlevel 1 echo "failed to compile" && exit /b 1
          jar cfm j2meDash8.jar src\META-INF\MANIFEST.MF rsc -C tmp\classes .
          if errorlevel 1 echo "failed to package" && exit /b 1
          if exist "j2meDash8.jar" move -Y "j2meDash8.jar" "bin"
          cd bin
          echo "successfully compiled"
          goto :eof
