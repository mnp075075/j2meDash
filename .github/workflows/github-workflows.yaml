# im testing github workflows

name: Automatically commit releases

run-name: ${{ github.repository }}

on:
  push:
    branches:
      - test-level-loader

permissions:
  contents: write

jobs:
  explore-github-actions:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          
      - name: Compile code for Java 8
        shell: cmd
        run: |
          dir /s
          cd bin
          REM compile.bat 1
